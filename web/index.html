<!doctype html>
<html lang="en" data-addon-id="dune-chat-monitor">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dune Chat Monitor</title>
  <link rel="stylesheet" href="./style.css?v=0.2.6">
</head>
<body>
  <main class="chat-page">
    <section class="control-surface" aria-label="Chat controls">
      <div id="channelTabs" class="channel-tabs" role="tablist" aria-label="Chat channel"></div>

      <label class="search-box" aria-label="Search chat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
        </svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search player or message…">
      </label>

      <div class="control-actions">
        <span id="liveBadge" class="live-badge is-live" aria-live="polite">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="liveLabel">Live</span>
        </span>

        <button id="refreshButton" class="refresh-button" type="button" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6v5h-5M4 18v-5h5M18.4 9A7 7 0 0 0 6.2 6.2L4 8m16 8-2.2 1.8A7 7 0 0 1 5.6 15" />
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </section>

    <div id="healthBanner" class="health-banner" hidden></div>

    <section class="chat-meta" aria-live="polite">
      <span id="messageCount">Loading chat…</span>
      <span id="lastUpdate"></span>
    </section>

    <section id="messages" class="messages" aria-live="polite">
      <div class="empty-state">
        <span class="empty-icon">•••</span>
        <span>Waiting for chat data…</span>
      </div>
    </section>

    <div id="historySentinel" class="history-sentinel" hidden></div>
  </main>

  <div id="playerActionMenu" class="player-action-menu" hidden role="menu" aria-label="Player actions">
    <div id="playerActionTitle" class="player-action-title"></div>
    <button type="button" data-player-action="copy-steam" role="menuitem">Copy SteamID</button>
    <button type="button" data-player-action="open-steam" role="menuitem">View Steam profile</button>
    <button type="button" data-player-action="copy-funcom" role="menuitem">Copy Funcom ID</button>
    <button type="button" data-player-action="copy-name" role="menuitem">Copy player name</button>
  </div>
  <div id="actionToast" class="action-toast" hidden aria-live="polite"></div>

  <script src="./app.js?v=0.2.6"></script>
</body>
</html>
