<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dune Chat Monitor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>Dune Chat Monitor</h1>
        <p id="serverName">Loading…</p>
      </div>
      <div id="statusBadge" class="badge badge-warn">CONNECTING</div>
    </header>

    <section class="toolbar">
      <select id="channelFilter" aria-label="Channel filter">
        <option value="">All channels</option>
      </select>
      <input id="searchInput" type="search" placeholder="Search sender or message…">
      <button id="refreshButton" type="button">Refresh</button>
    </section>

    <section class="meta">
      <span id="messageCount">0 messages</span>
      <span id="lastUpdate">Last update: —</span>
    </section>

    <section id="messages" class="messages">
      <div class="empty">Waiting for chat data…</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
