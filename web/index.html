<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dune Chat Monitor</title>
  <link rel="stylesheet" href="./addon.css" />
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <p class="eyebrow">Community Addon</p>
      <h1>Dune Chat Monitor</h1>
      <p id="serverName" class="muted">Read-only RAW capture</p>
    </div>
    <div id="connectionBadge" class="badge badge-warn">Starting…</div>
  </header>

  <section class="stats">
    <article class="stat"><span>Captured</span><strong id="messageCount">0</strong></article>
    <article class="stat"><span>Queue</span><strong id="queueName">—</strong></article>
    <article class="stat"><span>Last message</span><strong id="lastMessage">—</strong></article>
  </section>

  <section class="panel controls">
    <div class="field">
      <label for="search">Filter RAW capture</label>
      <input id="search" type="search" placeholder="ELOTEST, WilliamDG, routing key…" />
    </div>
    <button id="refresh" type="button">Refresh</button>
  </section>

  <section class="panel">
    <h2>RAW Chat Capture</h2>
    <p class="muted">Diagnostic view. No Dune database access and no game queue consumption.</p>
    <div id="messages" class="messages"><p class="empty">Waiting for collector data…</p></div>
  </section>
</main>
<script src="./addon.js"></script>
</body>
</html>
